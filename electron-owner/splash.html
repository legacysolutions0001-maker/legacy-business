<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legacy Business Owner</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #0d1117 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
    }
    .logo-container {
      width: 96px;
      height: 96px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 0 40px rgba(180, 120, 60, 0.4);
      animation: pulse 2s ease-in-out infinite;
      overflow: hidden;
      background: #fff;
    }
    .logo-container img {
      width: 86px;
      height: 86px;
      object-fit: contain;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #f0f4ff;
      margin-bottom: 4px;
    }
    .company {
      font-size: 13px;
      color: #c8914a;
      margin-bottom: 6px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .subtitle {
      font-size: 12px;
      color: #58687a;
      margin-bottom: 36px;
      letter-spacing: 0.5px;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 2px solid rgba(255,255,255,0.1);
      border-top-color: #c8914a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }
    .status {
      font-size: 12px;
      color: #4a5568;
      animation: fadeInOut 2s ease-in-out infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 40px rgba(180,120,60,0.4); }
      50% { box-shadow: 0 0 60px rgba(180,120,60,0.65); }
    }
    @keyframes fadeInOut {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    .version {
      position: absolute;
      bottom: 14px;
      right: 18px;
      font-size: 11px;
      color: #2a3040;
    }
    .copyright {
      position: absolute;
      bottom: 14px;
      left: 18px;
      font-size: 11px;
      color: #2a3040;
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <img src="./icons/icon.png" alt="Legacy Business Owner"
      onerror="this.parentElement.innerHTML='<span style=\'font-size:36px;font-weight:900;color:#c8914a\'>LO</span>'" />
  </div>
  <h1>Legacy Business Owner</h1>
  <div class="company">Legacy Solutions</div>
  <div class="subtitle">Owner Management & Licensing Control</div>
  <div class="spinner"></div>
  <div class="status" id="status">Starting services...</div>
  <div class="version">v1.0.0</div>
  <div class="copyright">© 2025 Legacy Solutions</div>
  <script>
    const messages = [
      'Starting services...',
      'Connecting to Firebase...',
      'Loading owner panel...',
      'Almost ready...',
    ];
    let i = 0;
    const el = document.getElementById('status');
    setInterval(() => {
      el.textContent = messages[i % messages.length];
      i++;
    }, 1800);
  </script>
</body>
</html>
