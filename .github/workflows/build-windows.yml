name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version (e.g. 1.0.0)"
        required: false
        default: "1.0.0"

  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node / pnpm ────────────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # ── Workspace dependencies ─────────────────────────────────────────────
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # ── Firebase service account ────────────────────────────────────────────
      # Write the secret JSON to the repo root so electron-builder can bundle it.
      # Add FIREBASE_SERVICE_ACCOUNT_JSON as a GitHub repository secret.
      - name: Write Firebase service account
        shell: bash
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo '{}' > firebase-service-account.json
            echo "WARNING: FIREBASE_SERVICE_ACCOUNT_JSON secret is not set. License verification will not work."
          else
            echo "$FIREBASE_SA" > firebase-service-account.json
            echo "Firebase service account written successfully."
          fi

      # ── Build shared backend + frontend ────────────────────────────────────
      - name: Build API Server
        env:
          PORT: 8080
          BASE_PATH: /
          NODE_ENV: production
        run: pnpm --filter @workspace/api-server build

      - name: Build Frontend
        env:
          PORT: 21973
          BASE_PATH: /
          NODE_ENV: production
        run: pnpm --filter @workspace/legacy-business build

      # ── Customer ERP (electron/) ───────────────────────────────────────────
      - name: Install Customer ERP Electron dependencies
        working-directory: electron
        run: npm install

      - name: Verify Customer ERP icon
        shell: powershell
        run: |
          if (!(Test-Path "electron\icons\icon.ico")) {
            throw "electron/icons/icon.ico not found. Please add the icon before building."
          }
          Write-Host "Customer ERP icon found."

      - name: Build Customer ERP Windows Installer
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish never

      # ── Owner App (electron-owner/) ────────────────────────────────────────
      - name: Install Owner App Electron dependencies
        working-directory: electron-owner
        run: npm install

      - name: Verify Owner App icon
        shell: powershell
        run: |
          if (!(Test-Path "electron-owner\icons\icon.ico")) {
            throw "electron-owner/icons/icon.ico not found. Please add the icon before building."
          }
          Write-Host "Owner App icon found."

      - name: Build Owner App Windows Installer
        working-directory: electron-owner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish never

      # ── List outputs ───────────────────────────────────────────────────────
      - name: List build output
        shell: powershell
        run: |
          Write-Host "=== Customer ERP ==="
          if (Test-Path "dist-electron") { Get-ChildItem -Recurse dist-electron | Where-Object { !$_.PSIsContainer } | Select-Object FullName, Length }
          Write-Host "=== Owner App ==="
          if (Test-Path "dist-electron-owner") { Get-ChildItem -Recurse dist-electron-owner | Where-Object { !$_.PSIsContainer } | Select-Object FullName, Length }

      # ── Upload artifacts ───────────────────────────────────────────────────
      - name: Upload Customer ERP Build
        uses: actions/upload-artifact@v4
        with:
          name: Legacy-Business-ERP-Windows-${{ github.event.inputs.version || '1.0.0' }}
          path: dist-electron/**/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload Owner App Build
        uses: actions/upload-artifact@v4
        with:
          name: Legacy-Business-Owner-Windows-${{ github.event.inputs.version || '1.0.0' }}
          path: dist-electron-owner/**/*.exe
          if-no-files-found: error
          retention-days: 30

      # ── GitHub Release (on version tags only) ──────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-electron/**/*.exe
            dist-electron-owner/**/*.exe
          generate_release_notes: true
