name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version (e.g. 1.0.0)"
        required: false
        default: "1.0.0"

  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup pnpm FIRST
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      # Setup Node.js with built-in pnpm cache
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Install dependencies
      - name: Install workspace dependencies
  run: pnpm install --frozen-lockfile --ignore-scripts

      # Build API
      - name: Build API Server
        env:
          PORT: 8080
          BASE_PATH: /
          NODE_ENV: production
        run: pnpm --filter @workspace/api-server build

      # Build Frontend
      - name: Build Frontend
        env:
          PORT: 21973
          BASE_PATH: /
          NODE_ENV: production
        run: pnpm --filter @workspace/legacy-business build

      # Install Electron dependencies
      - name: Install Electron dependencies
        working-directory: electron
        run: npm install

      # Ensure icon exists
      - name: Verify icon
        shell: powershell
        run: |
          if (!(Test-Path "electron\icons\icon.ico")) {
            throw "electron/icons/icon.ico not found."
          }

      # Build Electron application
      - name: Build Windows Installer
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-builder --win --x64 --publish never

      # Show build output
      - name: List build output
        shell: powershell
        run: |
          if (Test-Path "electron\dist") {
            Get-ChildItem -Recurse electron\dist
          }
          if (Test-Path "electron\dist-electron") {
            Get-ChildItem -Recurse electron\dist-electron
          }

      # Upload installer
      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: Legacy-Business-ERP-Windows-${{ github.event.inputs.version || '1.0.0' }}
          path: |
            electron/dist/**/*.exe
            electron/dist-electron/**/*.exe
          if-no-files-found: error
          retention-days: 30

      # Create Release when pushing a version tag
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            electron/dist/**/*.exe
            electron/dist-electron/**/*.exe
          generate_release_notes: true
