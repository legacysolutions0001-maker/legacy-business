kind = "web"
previewPath = "/"
title = "Legacy Business ERP"
description = "A production-grade commercial ERP system for managing multiple client companies. Includes invoicing, inventory management, HR, payroll, CRM, reporting, appointments, expenses, projects, day book, e-way bills, cash & bank, messaging, ledger, and a super admin portal for managing companies, licenses, and subscriptions."
version = "1.0.0"
id = "artifacts/legacy-business"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21973

[services.development]
run = "pnpm --filter @workspace/legacy-business run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/legacy-business", "run", "build" ]
serve = "static"
publicDir = "artifacts/legacy-business/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21973"
BASE_PATH = "/"
